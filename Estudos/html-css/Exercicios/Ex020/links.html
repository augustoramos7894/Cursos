<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
            #  = id
            .  = class
            :  = pseudo-class
            :: = pseudo-element
            >  = children
        */


        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: rgb(1, 252, 76);
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkgreen;
        }

        a:hover {
            color: blue;
            text-decoration: underline;
        }

        .especial {
            background-color: rgb(164, 223, 179);
        }

        a:active {
            color: yellow;
        }
        .especial::before {
            content: '→ ';
        }
        .especial::after {
            content: ' ←';
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/augustoramos7894" class="especial">Github</a></li>
        <li><a href="https://www.youtube.com/@augustojim3132" target="blank" class="especial">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com">Site do CursoemVideo</a></li>
    </ul>
</body>
</html>
